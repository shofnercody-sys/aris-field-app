<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>ARIS Field</title>
<meta name="description" content="Offline field data collection for agricultural research trials." />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />

<meta name="apple-mobile-web-app-title" content="ARIS Field" />
<meta name="theme-color" content="#1e3a5f" />
<style>
  :root {
    --navy: #1e3a5f; --green: #2e7d32; --bg: #f4f6f9; --card: #ffffff;
    --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --red: #b91c1c;
    --tabbar: 62px;
    --cushion: max(4px, calc(env(safe-area-inset-bottom) - 22px));
    --barH2: calc(54px + var(--cushion));
  }
  * { box-sizing: border-box; margin: 0; }
  /* Sunlight mode: max contrast for direct sun. Pure white ground, true black ink, heavier
     borders and weights - plus a wake lock (JS) so iOS doesn't dim or sleep mid-plot. */
  body.sun {
    --bg: #ffffff; --card: #ffffff; --ink: #000000; --muted: #222222;
    --line: #555555; --navy: #000000; --green: #005c1a; --red: #a00000;
  }
  body.sun main, body.sun .card { font-weight: 600; }
  body.sun .card { border-width: 2px; }
  body.sun input[type="text"], body.sun textarea, body.sun select,
  body.sun .sheet td input.cellIn { font-weight: 700; color: #000; border-color: #555; }
  body.sun .muted { color: #222; }
  body.sun header.app { background: #000; }
  #sunBtn { background: rgba(255,255,255,.16); color: #fff; border: 0; border-radius: 8px; padding: 8px 11px; font-size: 15px; flex-shrink: 0; }
  body.sun #sunBtn { background: #ffd700; color: #000; font-weight: 700; }
  /* License gate: full-screen key-activation card (no demo mode, no self-serve trial). */
  #licGate { position: fixed; inset: 0; z-index: 9999; background: var(--bg); display: flex;
    align-items: flex-start; justify-content: center; padding: 20px; overflow-y: auto; }
  #licGate .lic-card { width: 100%; max-width: 420px; background: var(--card); margin: auto;
    border: 1px solid var(--line); border-radius: 14px; padding: 26px 20px 20px; text-align: center; }
  #licGate .lic-logo { width: 64px; height: 64px; border-radius: 14px; margin-bottom: 10px; }
  #licGate h1 { font-size: 21px; color: var(--ink); margin-bottom: 4px; }
  #licGate .lic-tag { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
  #licGate .lic-notice { text-align: left; font-size: 13px; line-height: 1.5; background: #eef4ee;
    border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; margin-bottom: 14px; }
  #licGate .lic-label { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .8px;
    color: var(--muted); margin-bottom: 6px; }
  #licGate input { width: 100%; border: 1px solid var(--line); border-radius: 9px; padding: 12px;
    font-size: 16px; margin-bottom: 10px; background: #fff; color: var(--ink); }
  #licGate input.lic-key { font-family: ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: 1.5px; text-align: center; text-transform: uppercase; }
  #licGate .lic-msg { font-size: 12.5px; text-align: left; margin-top: 10px; line-height: 1.5; }
  #licGate .lic-msg.err { color: var(--red); }
  #licGate .lic-msg.ok { color: var(--green); }
  #licGate .lic-div { display: flex; align-items: center; gap: 10px; margin: 20px 0 10px;
    font-size: 11px; font-weight: 700; letter-spacing: .8px; color: var(--muted); }
  #licGate .lic-div::before, #licGate .lic-div::after { content: ''; flex: 1; border-top: 1px solid var(--line); }
  #licGate .lic-alts { display: flex; gap: 10px; }
  #licGate .lic-alt { flex: 1; padding: 11px 6px; border: 1px solid var(--line); border-radius: 9px;
    background: #fff; color: var(--ink); font-size: 13.5px; font-weight: 600; text-decoration: none; }
  #licGate .lic-tabs{display:flex;gap:6px;margin:0 0 12px;padding:4px;border-radius:12px;background:rgba(255,255,255,.08)}
.lic-tab{flex:1;padding:9px 8px;border:0;border-radius:9px;background:transparent;color:inherit;opacity:.75;font-weight:600;font-size:13px}
.lic-tab.on{background:#fff;color:#0a0a0a;opacity:1}
.lic-tiers-hdr { text-align: left; margin: 20px 0 8px; font-size: 11px; font-weight: 700;
    letter-spacing: .8px; color: var(--muted); }
  #licGate .lic-tiers { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  #licGate .lic-tier { display: flex; justify-content: space-between; align-items: baseline;
    padding: 9px 12px; font-size: 13px; border-bottom: 1px solid var(--line); text-align: left; }
  #licGate .lic-tier:last-child { border-bottom: none; }
  #licGate .lic-tier b { color: var(--green); white-space: nowrap; margin-left: 12px; }
  #licGate .lic-foot { font-size: 11px; color: var(--muted); margin-top: 16px; }
  html, body { height: 100%; }
  body {
    font: 16px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink);
    overflow-x: hidden;
  }
  header.app {
    background: var(--navy); color: #fff;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    display: flex; align-items: center; gap: 10px;
    position: sticky; top: 0; z-index: 5;
  }
  header.app .brand { height: 20px; width: auto; flex-shrink: 0; }
  header.app h1 { font-size: 16px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .95; }
  header.app button { background: rgba(255,255,255,.16); color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; font-size: 14px; flex-shrink: 0; }
  main {
    padding: 14px 14px calc(var(--tabbar) + env(safe-area-inset-bottom) + 44px);
    max-width: 560px; margin: 0 auto;
    /* Every page is kept minimally scrollable ON PURPOSE: iOS misplaces fixed bottom chrome
       only on pages too short to scroll (why Photos/Log stuck while tall tabs self-healed).
       With scroll always available, the render-time scrollTo re-pins the bar on every tab. */
    min-height: calc(100vh + 40px);
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .card h2 { font-size: 15px; margin-bottom: 8px; }
  .muted { color: var(--muted); font-size: 13px; }
  .center { text-align: center; }
  .btn {
    display: block; width: 100%; text-align: center; background: var(--green); color: #fff;
    border: 0; border-radius: 10px; padding: 13px; font-size: 16px; font-weight: 600; margin-top: 10px;
  }
  .btn.secondary { background: #e8edf3; color: var(--ink); font-weight: 500; }
  .btn.small { padding: 10px; font-size: 14px; margin-top: 8px; }
  .btn.danger { background: #fee2e2; color: var(--red); font-weight: 500; }
  .btn:disabled { opacity: .45; }
  input[type="text"], textarea, select {
    width: 100%; border: 1px solid var(--line); border-radius: 9px; padding: 11px; font-size: 16px; background: #fff; color: var(--ink);
  }
  label.f { display: block; margin-top: 10px; font-size: 13px; color: var(--muted); }
  label.f > * { margin-top: 4px; }
  /* trial list */
  .trialRow { display: flex; align-items: center; gap: 10px; padding: 12px 2px; border-bottom: 1px solid var(--line); }
  .trialRow:last-child { border-bottom: 0; }
  .trialRow .grow { flex: 1; min-width: 0; }
  .trialRow .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trialRow button { border: 0; background: #eef2f7; border-radius: 8px; padding: 9px 13px; font-size: 14px; flex-shrink: 0; }
  /* entry */
  .plotHead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .plotHead .num { font-size: 28px; font-weight: 800; }
  .plotHead .meta { font-size: 15px; color: var(--muted); }
  .valRow { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .valRow .lbl { flex: 1 1 150px; font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
  .valRow input { flex: 0 0 120px; width: 120px; text-align: right; font-size: 20px; padding: 12px 10px; }
  .subGroup { margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--line, #e5e7eb); }
  .subGroup .lbl { font-size: 14px; margin-bottom: 6px; }
  .subBoxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
  .subBoxes input { width: 100%; box-sizing: border-box; text-align: center; font-size: 18px; padding: 10px 4px; }
  .subMean { margin-top: 6px; font-size: 14px; text-align: right; }
  .subMean b { font-size: 18px; }
  .sheet input.meanIn { background: #f1f5f9; color: #475569; font-weight: 700; }
  /* Out-of-range warning (advisory, never blocking) — amber inset outline works on the
     borderless grid cells and the bordered plot/subsample inputs alike. */
  input.warn { background: #fffbeb; color: #b45309; box-shadow: inset 0 0 0 2px #f59e0b; border-radius: 8px; }
  .histBox summary { cursor: pointer; font-weight: 600; }
  .histList { list-style: none; margin: 8px 0 0; padding: 0; }
  .histList li { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .histList li:last-child { border-bottom: none; }
  .qaWarn { color: #b45309; font-weight: 600; margin: 6px 0 4px; }
  .stepBar { display: flex; gap: 8px; margin-top: 12px; }
  .stepBar .btn { flex: 1; margin-top: 0; }
  .progress { text-align: center; margin-top: 10px; }
  /* entry grid view */
  .modeRow { display: flex; gap: 8px; margin-bottom: 10px; }
  .modeRow button { flex: 1; border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 9px; font-size: 14px; color: var(--muted); }
  .modeRow button.on { border-color: var(--green); color: var(--green); font-weight: 700; background: #f0fdf4; }
  .gridWrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: #fff; -webkit-overflow-scrolling: touch; }
  table.sheet { border-collapse: collapse; }
  .sheet th, .sheet td { border-bottom: 1px solid var(--line); border-right: 1px solid #eef2f7; padding: 0; }
  .sheet thead th { background: #f8fafc; position: sticky; top: 0; z-index: 2; }
  .sheet th input { font-weight: 600; font-size: 12px; width: 92px; padding: 9px 6px; border: 0; background: transparent; color: var(--ink); }
  .sheet td input.cellIn { width: 92px; padding: 11px 6px; border: 0; font-size: 15px; text-align: right; background: transparent; }
  .sheet .rowHead { position: sticky; left: 0; background: #fff; z-index: 1; padding: 6px 8px; font-size: 12px; white-space: nowrap; border-right: 2px solid var(--line); }
  .sheet .rowHead b { font-size: 14px; }
  .sheet thead .rowHead { background: #f8fafc; z-index: 3; }
  .addColBtn { border: 1px dashed #94a3b8; background: #fff; color: var(--muted); border-radius: 8px; padding: 8px 10px; font-size: 13px; margin: 8px; white-space: nowrap; }
  /* lists */
  .item { padding: 10px 2px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  .item:last-child { border-bottom: 0; }
  .item .ts { font-size: 12px; color: var(--muted); }
  .item .del { float: right; border: 0; background: none; color: var(--red); font-size: 15px; padding: 2px 8px; }
  /* photos */
  .photoGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .photoCard { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
  .photoCard img { display: block; width: 100%; height: 120px; object-fit: cover; }
  .photoCard .pc { padding: 7px 9px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .photoCard .del { width: 100%; border: 0; background: #fff5f5; color: var(--red); padding: 7px; font-size: 13px; }
  /* voice */
  .memo audio { width: 100%; margin-top: 6px; }
  .recDot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #dc2626; margin-right: 7px; animation: blink 1s infinite; vertical-align: middle; }
  @keyframes blink { 50% { opacity: .25; } }
  /* tab bar */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: #fff;
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 5;
  }
  body.sun nav.tabs { background: #fff; }
  nav.tabs button { flex: 1; border: 0; background: none; padding: 9px 2px 7px; font-size: 11.5px; color: var(--muted); }
  nav.tabs button.on { color: var(--green); font-weight: 700; }
  /* While the iOS keyboard is up, position:fixed elements ride above it and float mid-screen.
     The bar hides during typing (the keyboard has its own Done) and returns on dismiss. */
  nav.tabs.kbHidden, footer.status.kbHidden, .banner.update.kbHidden { display: none; }
  nav.tabs .ic { display: block; font-size: 20px; line-height: 1.2; }
  .note { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; border-radius: 9px; padding: 9px 11px; font-size: 13.5px; margin-bottom: 10px; overflow-wrap: anywhere; }
  .err { background: #fef2f2; border-color: #fecaca; color: var(--red); }
  .hidden { display: none !important; }
  .banner {
    position: sticky; top: 0; z-index: 6; display: flex; align-items: center; gap: 10px;
    background: #fff7ed; border-bottom: 1px solid #fed7aa; color: #9a3412;
    padding: 9px 14px; font-size: 13.5px;
  }
  .banner.update {
    /* Bottom placement: the top of a home-screen app sits under the iPhone status bar/notch,
       which made the button untappable. Floating above the tab bar is always reachable. */
    position: fixed; top: auto; left: 10px; right: 10px;
    bottom: calc(var(--tabbar) + env(safe-area-inset-bottom) + 12px);
    z-index: 30;
    background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af;
    border-radius: 12px; box-shadow: 0 8px 24px rgba(15, 23, 42, .25);
    flex-wrap: wrap;
  }
  .banner.update button {
    background: #1e40af; color: #fff; font-weight: 700;
    padding: 14px 20px; font-size: 15px; border-radius: 9px; min-height: 44px;
  }
  .banner .grow { flex: 1; }
  .banner button { border: 0; border-radius: 7px; padding: 7px 11px; font-size: 13px; background: rgba(0,0,0,.08); color: inherit; }
  .warnTag { color: #b45309; font-weight: 600; }
  table.res { width: 100%; border-collapse: collapse; font-size: 14px; }
  .res th, .res td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; }
  .res th:first-child, .res td:first-child { text-align: left; }
  .res thead th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .res tr.best td { background: #f0fdf4; font-weight: 700; }
  .lightbox {
    position: fixed; inset: 0; background: rgba(10,15,25,.92); z-index: 20;
    display: flex; align-items: center; justify-content: center; padding: 18px;
  }
  .lightbox img { max-width: 100%; max-height: 88%; border-radius: 8px; }
  .lightbox .cap { position: absolute; bottom: calc(14px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; color: #e2e8f0; font-size: 13px; padding: 0 20px; }
  footer.status {
    text-align: center; color: var(--muted); font-size: 11px;
    padding: 6px 14px calc(var(--tabbar) + env(safe-area-inset-bottom) + 10px);
    margin-top: -34px;
  }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; vertical-align: middle; margin-right: 4px; }
  .dot.on { background: #22c55e; } .dot.off { background: #94a3b8; }
  /* Legal: EULA click-wrap on the gate + in-app EULA / Legal panel. */
  #licGate .lic-eula { display: flex; align-items: flex-start; gap: 9px; text-align: left; font-size: 12.5px;
    line-height: 1.45; color: var(--ink); margin: 12px 0 2px; }
  #licGate .lic-eula input[type="checkbox"] { width: 18px; height: 18px; margin: 1px 0 0; flex-shrink: 0; accent-color: var(--green); }
  #licGate .lic-eula a, footer.status a, #eulaPanel a { color: var(--green); text-decoration: underline; }
  #eulaPanel { position: fixed; inset: 0; z-index: 10000; background: rgba(0,0,0,.55); display: flex;
    align-items: center; justify-content: center; padding: 14px; }
  #eulaPanel .eula-card { width: 100%; max-width: 560px; max-height: calc(100vh - 28px); background: var(--card);
    color: var(--ink); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  #eulaPanel .eula-hdr { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 14px 16px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 15px; }
  #eulaPanel .eula-hdr small { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); }
  #eulaPanel .eula-note { padding: 8px 16px; font-size: 13.5px; line-height: 1.35; background: #fff7e0; color: #6b4d00; border-bottom: 1px solid #eadfb8; }
  #eulaPanel .eula-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 16px; font-size: 13px;
    line-height: 1.55; text-align: left; }
  #eulaPanel .eula-body h2 { font-size: 16px; margin: 0 0 10px; }
  #eulaPanel .eula-body h3 { font-size: 13.5px; margin: 16px 0 6px; }
  #eulaPanel .eula-body p { margin: 0 0 10px; white-space: pre-wrap; }
  #eulaPanel .eula-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); font-size: 12px; }
  #eulaPanel .eula-foot .links { display: flex; gap: 12px; flex-wrap: wrap; }
  #eulaPanel .eula-foot button { background: var(--navy); color: #fff; border: 0; border-radius: 9px; padding: 10px 18px;
    font-size: 14px; font-weight: 600; }
  footer.status .legal { display: block; margin-top: 4px; }
</style>
</head>
<body>
<header class="app">
  <img src="logo-white.png" alt="ARIS" class="brand" />
  <h1 id="title">Field</h1>
  <button id="sunBtn" title="Sunlight mode: maximum contrast + keep the screen awake">☀️</button>
  <button id="backBtn" class="hidden">Trials</button>
</header>
<main id="main"></main>
<nav class="tabs hidden" id="tabs">
  <button data-tab="entry"><span class="ic">📋</span>Entry</button>
  <button data-tab="results"><span class="ic">📊</span>Results</button>
  <button data-tab="photos"><span class="ic">📷</span>Photos</button>
  <button data-tab="log"><span class="ic">🗒️</span>Log</button>
  <button data-tab="notes"><span class="ic">📝</span>Notes</button>
  <button data-tab="save"><span class="ic">💾</span>Save</button>
</nav>
<input type="file" id="fileIn" accept=".csv,text/csv" class="hidden" />
<input type="file" id="photoIn" accept="image/*" capture="environment" class="hidden" />

<script>

   Everything is stored on THIS device (localStorage + IndexedDB for photos/voice);
   nothing is uploaded anywhere. Use the Save tab to share your data:
   either one bundle file (data + photos + voice memos) that desktop ARIS imports
   directly, or plain CSVs. */

const APP_VERSION = '2.11.0';

/* ── IndexedDB for photos + voice memos ─────────────── */
let dbP = null;
function idb() {
  if (dbP) return dbP;
  dbP = new Promise((res, rej) => {
    const r = indexedDB.open('arisFieldMedia', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('media', { keyPath: 'id' }).createIndex('trial', 'trialId'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });

}

  return new Promise((res, rej) => {
    const tx = db.transaction('media', 'readwrite');
    tx.objectStore('media').put(rec);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
async function mediaList(trialId, kind) {
  const db = await idb();
  return new Promise((res, rej) => {
    const out = [];
    const req = db.transaction('media').objectStore('media').index('trial').openCursor(IDBKeyRange.only(trialId));
    req.onsuccess = () => {
      const c = req.result;
      if (!c) { res(out.filter(m => !kind || m.kind === kind).sort((a, b) => a.ts.localeCompare(b.ts))); return; }
      out.push(c.value); c.continue();
    };
    req.onerror = () => rej(req.error);
  });
}

  return new Promise((res, rej) => {
    const tx = db.transaction('media', 'readwrite');
    tx.objectStore('media').delete(id);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
const blobToB64 = (blob) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(String(r.result).split(',')[1] ?? '');
  r.onerror = () => rej(r.error);
  r.readAsDataURL(blob);

/* Downscale a photo to ≤1400px JPEG so bundles stay email-sized. */
async function shrinkPhoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const scale = Math.min(1, 1400 / Math.max(img.width, img.height));
    const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(img, 0, 0, w, h);
    const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.82));
    return blob || file;
  } catch (e) { return file; } finally { URL.revokeObjectURL(url); }
}

/* ── CSV + bundle building ──────────────────────────── */
function parseLine(line) {
  const out = []; let curS = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQ) { if (c === '"') { if (line[i+1] === '"') { curS += '"'; i++; } else inQ = false; } else curS += c; }
    else if (c === '"') inQ = true;
    else if (c === ',') { out.push(curS); curS = ''; }
    else curS += c;
  }
  out.push(curS); return out;
}
function trialFromTemplate(name, text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
  if (lines.length < 2) throw new Error('That CSV has no plot rows.');
  const head = parseLine(lines[0]);
  if (head.length < 4) throw new Error('Expected columns: plot, rep, treatment, then variables.');
  const cols = head.slice(3).map(h => h.trim());
  const plots = lines.slice(1).map(l => {
    const c = parseLine(l);
    const vals = {};
    cols.forEach((_, i) => { const raw = (c[3+i] ?? '').trim(); if (raw !== '' && isFinite(Number(raw))) vals[i] = Number(raw); });
    return { plot: Number(c[0]), rep: (c[1] ?? '').trim(), trt: (c[2] ?? '').trim(), vals };
  }).filter(p => isFinite(p.plot));
  if (!plots.length) throw new Error('No valid plot rows found.');
  return { id: uid('t'), name, cols, plots, log: [], notes: [] };
}
/* Group a trial's columns into variables: { label, subs:[colIdx…], mean: colIdx|null }.
   "Sev #1", "Sev #2", "Sev" → one group with two subsample columns and a mean column. A plain
   column with no "#k" siblings is a group of its own (subs = [], mean = its index). */
function colGroups(cols) {
  const groups = new Map();
  const order = [];
  cols.forEach((c, i) => {
    const m = /^(.*?)\s*#(\d+)$/.exec(String(c).trim());
    const label = m ? m[1].trim() : String(c).trim();
    const key = label.toLowerCase();
    if (!groups.has(key)) { groups.set(key, { label, subs: [], mean: null }); order.push(key); }
    const g = groups.get(key);
    if (m) g.subs[Number(m[2]) - 1] = i; else g.mean = i;
  });
  return order.map(k => { const g = groups.get(k); g.subs = g.subs.filter(i => i != null); return g; });
}
/* Parse a "0–100" / "1-9" / "20 – 60" valid-range string into {min,max}. En-dash, em-dash
   or hyphen separators; blank/descriptive strings return null (so those variables are never
   range-checked). Mirrors the desktop's parseRange. */
function parseRange(range) {
  if (!range) return null;
  const m = String(range).trim().match(/^(-?\d+(?:\.\d+)?)\s*[–—-]\s*(-?\d+(?:\.\d+)?)$/);
  if (!m) return null;
  const min = Number(m[1]), max = Number(m[2]);
  if (!isFinite(min) || !isFinite(max) || min > max) return null;
  return { min, max };
}
/* True when a finite value is outside the variable's declared range. Advisory only — never
   blocks entry, just flags the cell so the rater can double-check an unusual reading. */
function outOfRange(value, range) {
  if (typeof value !== 'number' || !isFinite(value)) return false;
  const r = parseRange(range);
  return r ? (value < r.min || value > r.max) : false;
}
/* Resolve the valid range for a variable group from the trial's optional ranges map. */
function rangeForLabel(t, label) {
  return t && t.ranges ? t.ranges[String(label).toLowerCase()] : undefined;
}
/* Map every column index (subsamples + mean) to its variable's valid range, when one is set. */
function colRanges(t) {
  const map = {};
  if (!t || !t.ranges) return map;
  colGroups(t.cols).forEach(g => {
    const r = rangeForLabel(t, g.label);
    if (!r) return;
    if (g.mean != null) map[g.mean] = r;
    g.subs.forEach(ci => { map[ci] = r; });
  });
  return map;
}

/* ── Observation-history audit trail (GLP), mirroring desktop. Every change to a value is
   captured (old→new, who, when) onto t.audit; consecutive edits to the same cell within a
   short window coalesce into one entry, and an edit back to the original drops it. Rides along
   in the export bundle so desktop ARIS can fold it into its own audit log. */
let fieldAuditSession = null;
function logFieldEdit(t, p, colIdx, from, to) {
  const key = t.id + '|' + p.plot + '|' + colIdx;
  const now = Date.now();
  const s = fieldAuditSession;
  if (s && s.key === key && now - s.ts < 30000) {
    if (s.from === to) {
      if (t.audit) { const i = t.audit.findIndex(e => e.id === s.id); if (i >= 0) t.audit.splice(i, 1); }
      fieldAuditSession = null;
    } else {
      const e = t.audit && t.audit.find(x => x.id === s.id);
      if (e) { e.to = to; e.at = new Date().toISOString(); }
      s.ts = now;
    }
    return;
  }
  if (from === to) return;
  if (!t.audit) t.audit = [];
  const id = uid('a');
  t.audit.push({ id, plot: p.plot, variable: t.cols[colIdx], from, to, user: S.rater || 'Unattributed', at: new Date().toISOString() });
  fieldAuditSession = { key, from, id, ts: now };
}

/* Recompute a plot's mean column from its subsample columns (blank when none entered). */
function updateGroupMean(p, g) {
  if (g.mean == null || !g.subs.length) return;
  const vs = g.subs.map(i => p.vals[i]).filter(v => typeof v === 'number');
  if (vs.length) p.vals[g.mean] = Math.round((vs.reduce((a, b) => a + b, 0) / vs.length) * 1000) / 1000;
  else delete p.vals[g.mean];
}
function trialQuickSetup(name, colsStr, trtsStr, reps, subsPerPlot, rangesStr) {
  const baseVars = colsStr.split(',').map(s => s.trim()).filter(Boolean);
  let cols = baseVars.slice();
  const subN = Math.max(1, Math.min(50, Math.round(Number(subsPerPlot) || 1)));
  if (subN > 1) cols = cols.flatMap(c => [...Array.from({ length: subN }, (_, k) => c + ' #' + (k + 1)), c]);
  const trts = trtsStr.split(',').map(s => s.trim()).filter(Boolean);
  if (!cols.length || !trts.length || !(reps > 0)) throw new Error('Please fill in variables, treatments and replications.');
  // Optional valid ranges: one per variable, same order (e.g. "0-100, 0-15"). Keyed by the
  // lowercased variable label so entry-time flagging can look them up. Blank entries skipped.
  const ranges = {};
  if (rangesStr && rangesStr.trim()) {
    rangesStr.split(',').map(s => s.trim()).forEach((r, i) => {
      if (r && baseVars[i] && parseRange(r)) ranges[baseVars[i].toLowerCase()] = r;
    });
  }
  const plots = []; let n = 1;
  for (let r = 1; r <= reps; r++) for (const trt of trts) plots.push({ plot: n++, rep: 'R' + r, trt, vals: {} });
  return { id: uid('t'), name, cols, plots, log: [], notes: [], ranges };
}

  for (const p of t.plots) rows.push([p.plot, p.rep, p.trt, ...t.cols.map((_, i) => p.vals[i] ?? '')].map(csvCell).join(','));
  return rows.join('\n');
}

  for (const e of t.log) rows.push([e.ts, e.type, csvCell(e.text)].join(','));
  rows.push('# ' + watermarkLine());

}

  for (const e of t.notes) rows.push([e.ts, csvCell(e.text)].join(','));
  rows.push('# ' + watermarkLine());
  return rows.join('\n');

async function trialSection(t) {
  const media = await mediaList(t.id);
  const photos = [], voice = [];
  for (const m of media) {
    const rec = { ts: m.ts, caption: m.caption || '', mime: m.mime, dataB64: await blobToB64(m.blob) };
    if (m.kind === 'photo') photos.push({ ...rec, plot: m.plot || '' });
    else voice.push(rec);

    audit: t.audit || [],
    rater: S.rater || '',

async function buildBundle(trials) {

  for (const t of trials) sections.push(await trialSection(t));

async function shareFile(filename, content, mime) {
  const file = new File([content], filename, { type: mime });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: filename });
      return true;
    } catch (e) {
      // Cancelling the share sheet means the data was NOT saved anywhere.
      if (e.name === 'AbortError') return false;
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type: mime }));
  a.download = filename; a.click(); URL.revokeObjectURL(a.href);
  return true;
}

/* ── Account sync: "Send to desktop" ────────────────────
   One tap pushes a trial to the ARIS account's sync mailbox on the portal; desktop ARIS
   (signed in to the same account) pulls it down and files it — no email, no AirDrop.
   Every part is encrypted HERE with AES-256-GCM under a key derived (PBKDF2) from the
   account's Field access code + email, so the server only ever holds ciphertext, and the
   desktop deletes each upload the moment it has imported it. Big uploads (photos) are
   split into parts under the portal's request-size limit and reassembled on the desktop. */
const SYNC_ENVELOPE = 'aris-sync-v1';
const SYNC_PART_LIMIT = 2600000; // chars of plaintext JSON per part (base64 + JSON must stay < 4.5 MB)
const syncB64 = (bytes) => { let r = ''; for (let i = 0; i < bytes.length; i += 0x8000) r += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(r); };
async function syncKey(acct) {
  if (!window.crypto || !crypto.subtle) throw new Error('This browser cannot encrypt (needs HTTPS).');
  const te = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', te.encode(licNorm(acct.code)), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', hash: 'SHA-256', salt: te.encode('aris-sync-v1:' + String(acct.email || '').trim().toLowerCase()), iterations: 200000 },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt']);
}
async function syncEncrypt(key, text) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(text)));
  return JSON.stringify({ enc: SYNC_ENVELOPE, iv: syncB64(iv), ct: syncB64(ct) });
}
/* Split one trial into parts: part 1 = values/log/notes (+ as much media as fits), the rest media only. */
async function syncParts(t) {
  const sec = await trialSection(t);
  const media = [...sec.photos.map(m => ({ k: 'photos', m })), ...sec.voice.map(m => ({ k: 'voice', m }))];
  const base = { ...sec, photos: [], voice: [] };
  const parts = [];
  let cur = base, size = JSON.stringify(base).length;
  for (const item of media) {
    const w = (item.m.dataB64 || '').length + 200;
    if (size + w > SYNC_PART_LIMIT && (cur.photos.length || cur.voice.length || cur === base)) {
      parts.push(cur);
      cur = { name: sec.name, cols: [], plots: [], log: [], notes: [], photos: [], voice: [], assessments: [] };
      size = 200;
    }
    cur[item.k].push(item.m); size += w;
  }
  parts.push(cur);
  return parts.map(sec2 => JSON.stringify({ format: 'aris-field-bundle', version: 3, appVersion: APP_VERSION, licensee: licenseeId(), generator: generatorTag(), exportedAt: new Date().toISOString(), trials: [sec2] }));
}
function syncDevice() {
  const ua = navigator.userAgent || '';
  const m = /iPad|iPhone|Android|Windows|Macintosh/.exec(ua);
  return (m ? m[0] : 'phone') + ' · ARIS Field ' + APP_VERSION;
}
/* Push every trial in `trials`; `progress(text)` updates the button. Returns { ok, sent, error }. */
async function syncPush(trials, progress) {
  const acct = acctLoad();
  if (!acct || !acct.code) return { ok: false, error: 'Enter your ARIS Field access code first.' };
  if (!navigator.onLine) return { ok: false, error: 'You are offline. Save a file instead, or send when you have signal.' };
  let key;
  try { key = await syncKey(acct); } catch (e) { return { ok: false, error: e.message || String(e) }; }
  let sent = 0;
  for (const t of trials) {
    // A retry after a half-finished upload first discards the orphaned parts on the server.
    if (t.syncPartial && t.syncPartial.ids && t.syncPartial.ids.length) {
      await portalPost('/api/app/sync', { code: acct.code, op: 'ack', ids: t.syncPartial.ids });
      delete t.syncPartial; save();
    }
    let parts;
    try { parts = await syncParts(t); } catch (e) { return { ok: false, sent, error: 'Could not pack "' + t.name + '": ' + (e.message || e) }; }
    const group = uid('g');
    const ids = [];
    for (let i = 0; i < parts.length; i++) {
      progress && progress('Sending ' + t.name + (parts.length > 1 ? ' (' + (i + 1) + '/' + parts.length + ')' : '') + '\u2026');
      let payload;
      try { payload = await syncEncrypt(key, parts[i]); } catch (e) { return { ok: false, sent, error: 'Encryption failed: ' + (e.message || e) }; }
      const r = await portalPost('/api/app/sync', { code: acct.code, op: 'push', kind: 'field-bundle', name: t.name, device: syncDevice(), licensee: licenseeId(), generator: generatorTag(), group, part: i + 1, parts: parts.length, payload });
      if (!r.ok) {
        t.syncPartial = { group, ids }; save();
        return { ok: false, sent, error: r.error === 'offline' ? 'Lost the connection while sending "' + t.name + '". Try again when you have signal.' : r.error };
      }
      ids.push(r.id);
    }
    delete t.syncPartial;
    t.syncedAt = new Date().toISOString();
    sent++;
  }
  markExported(trials);
  return { ok: true, sent };
}

let objectUrls = [];
function freeUrls() { objectUrls.forEach(u => URL.revokeObjectURL(u)); objectUrls = []; }
function objUrl(blob) { const u = URL.createObjectURL(blob); objectUrls.push(u); return u; }

function render() {
  freeUrls();
  stopRecorder(false);
  // Every tab opens at its top; the window scroll also lets iOS re-pin fixed chrome after
  // a keyboard session (the self-heal old versions had by accident). The delayed second pass
  // catches iOS applying its scroll clamp with animation AFTER the first scrollTo.
  window.scrollTo(0, 0);
  setTimeout(() => {
    window.scrollTo(0, 1);
    window.scrollTo(0, 0);
  }, 280);
  const t = cur();
  if (!t) view = 'home';
  tabs.classList.toggle('hidden', view === 'home');
  scheduleHeal();
  backBtn.classList.toggle('hidden', view === 'home');
  titleEl.textContent = view === 'home' ? 'Field' : t.name;
  tabs.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.tab === view));
  if (view === 'home') renderHome();
  else if (view === 'entry') renderEntry(t);
  else if (view === 'results') renderResults(t);
  else if (view === 'photos') renderPhotos(t);
  else if (view === 'log') renderList(t, 'log');
  else if (view === 'notes') renderNotes(t);
  else if (view === 'save') renderSave(t);
  if (flash) { const n = document.createElement('div'); n.className = 'note' + (flash.err ? ' err' : ''); n.textContent = flash.text; main.prepend(n); flash = null; }
}

/* ── entry ──────────────────────────────────────────── */
function renderEntry(t) {
  if ((S.entryMode ?? 'plot') === 'grid') { renderEntryGrid(t); return; }
  plotIdx = Math.max(0, Math.min(plotIdx, t.plots.length - 1));
  const p = t.plots[plotIdx];
  const done = t.plots.filter(x => Object.keys(x.vals).length > 0).length;
  main.innerHTML = `
    ${modeToggleHTML('plot')}
    <div class="card">
      <div class="plotHead"><span class="num">Plot ${p.plot}</span><span class="meta">${esc(p.rep)} · Treatment ${esc(p.trt)}</span></div>
      <div id="vals"></div>
      <div class="stepBar">
        <button class="btn secondary" id="prev" ${plotIdx === 0 ? 'disabled' : ''}>‹ Previous</button>
        <button class="btn" id="next" ${plotIdx === t.plots.length - 1 ? 'disabled' : ''}>Next ›</button>
      </div>
      <div class="progress muted">Plot ${plotIdx + 1} of ${t.plots.length} · ${done} plot${done === 1 ? ' has' : 's have'} data</div>
      <label class="f">Jump to a plot
        <select id="jump">${t.plots.map((x, i) => `<option value="${i}" ${i === plotIdx ? 'selected' : ''}>Plot ${x.plot} — ${esc(x.rep)} · Trt ${esc(x.trt)}</option>`).join('')}</select>
      </label>
    </div>
    <p class="muted center">It's fine to leave a box empty when there's no data point for it.</p>
    ${(t.audit && t.audit.length) ? `<details class="card histBox"><summary>Change history (${t.audit.length})</summary>
      <ul class="histList">${[...t.audit].sort((a, b) => (b.at || '').localeCompare(a.at || '')).slice(0, 100).map(e =>
        `<li>Plot ${e.plot} · ${esc(e.variable)}: ${e.from == null ? '(blank)' : esc(String(e.from))} → ${e.to == null ? '(blank)' : esc(String(e.to))} <span class="muted">· ${esc(e.user || '')}${e.at ? ' · ' + new Date(e.at).toLocaleString() : ''}</span></li>`).join('')}</ul>
    </details>` : ''}`;
  const vals = main.querySelector('#vals');
  const groups = colGroups(t.cols);
  const colR = colRanges(t);
  // ` class="warn" title="…"` for an out-of-range value, else ''. Advisory only.
  const warnFor = (v, ci) => outOfRange(v, colR[ci]) ? ` class="warn" title="Outside the valid range ${esc(colR[ci])}"` : '';
  groups.forEach((g) => {
    const row = document.createElement('div');
    if (!g.subs.length) {
      row.className = 'valRow';
      row.innerHTML = `<span class="lbl">${esc(g.label)}${colR[g.mean] ? ` <span class="muted">· ${esc(colR[g.mean])}</span>` : ''}</span><input type="text" inputmode="decimal"${warnFor(p.vals[g.mean], g.mean)} value="${p.vals[g.mean] ?? ''}" data-i="${g.mean}" aria-label="${esc(g.label)}" />`;
    } else {
      // One box per subsample; the plot value (mean) is shown, not typed.
      row.className = 'subGroup';
      const rng = rangeForLabel(t, g.label);
      row.innerHTML = `<div class="lbl">${esc(g.label)} <span class="muted">· ${g.subs.length} subsamples${rng ? ` · range ${esc(rng)}` : ''}</span></div>
        <div class="subBoxes">${g.subs.map((ci, k) => `<input type="text" inputmode="decimal"${warnFor(p.vals[ci], ci)} value="${p.vals[ci] ?? ''}" data-i="${ci}" aria-label="${esc(g.label)} subsample ${k + 1}" placeholder="#${k + 1}" />`).join('')}</div>
        <div class="subMean muted">mean <b data-mean-of="${esc(g.label)}">${g.mean != null && p.vals[g.mean] != null ? p.vals[g.mean] : '—'}</b></div>`;
    }
    vals.appendChild(row);
  });
  vals.oninput = (e) => {
    const i = e.target.dataset.i; if (i == null) return;
    const raw = e.target.value.trim();
    const n = parseEntry(raw);
    const prev = p.vals[i] ?? null;
    if (n == null) delete p.vals[i]; else p.vals[i] = n;
    logFieldEdit(t, p, Number(i), prev, n);
    // Live out-of-range flag on the edited box.
    const bad = outOfRange(p.vals[i], colR[Number(i)]);
    e.target.classList.toggle('warn', bad);
    if (bad) e.target.title = 'Outside the valid range ' + colR[Number(i)]; else e.target.removeAttribute('title');
    const g = groups.find(x => x.subs.includes(Number(i)));
    if (g) {
      updateGroupMean(p, g);
      const b = vals.querySelector('[data-mean-of="' + CSS.escape(g.label) + '"]');

  main.querySelector('#next').onclick = () => { plotIdx++; render(); };
  main.querySelector('#jump').onchange = (e) => { plotIdx = Number(e.target.value); render(); };

}

/* Desktop-style grid: every plot as a row, every variable as a renameable column,
   editable cells, add-variable button. Scrolls sideways like a spreadsheet. */
function renderEntryGrid(t) {
  const head = t.cols.map((c, i) =>
    `<th><input value="${esc(c)}" data-col="${i}" aria-label="Column name ${i + 1}" /></th>`).join('');
  const meanCols = new Set(colGroups(t.cols).filter(g => g.subs.length && g.mean != null).map(g => g.mean));
  const colR = colRanges(t);
  const rows = t.plots.map((p, pi) => {
    const cells = t.cols.map((_, ci) => {
      const isMean = meanCols.has(ci);
      const flagged = outOfRange(p.vals[ci], colR[ci]);
      const cls = 'cellIn' + (isMean ? ' meanIn' : '') + (flagged ? ' warn' : '');
      const attrs = (isMean ? 'readonly ' : '') + (flagged ? `title="Outside the valid range ${esc(colR[ci])}"` : (isMean ? 'title="Mean of the subsamples"' : ''));
      return `<td><input class="${cls}" type="text" inputmode="decimal" value="${p.vals[ci] ?? ''}" data-p="${pi}" data-c="${ci}" aria-label="Plot ${p.plot} ${esc(t.cols[ci])}" ${attrs} /></td>`;
    }).join('');
    return `<tr><td class="rowHead"><b>${p.plot}</b> ${esc(p.rep)} · ${esc(p.trt)}</td>${cells}</tr>`;
  }).join('');
  const done = t.plots.reduce((s2, p) => s2 + Object.keys(p.vals).length, 0);
  main.innerHTML = `
    ${modeToggleHTML('grid')}
    <div class="gridWrap">
      <table class="sheet">
        <thead><tr><th class="rowHead">Plot</th>${head}<th><button class="addColBtn" id="addCol">+ variable</button></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <p class="muted center" style="margin-top:8px">${done} values entered · tap a column name to rename it · swipe the table sideways for more columns</p>
    <p class="muted center">Tip: if this trial syncs with the desktop, keep column names matching the desktop's so values line up on import.</p>`;
  const wrap = main.querySelector('.gridWrap');
  // Enter (the keyboard's Go/Done) jumps to the same column in the next plot row.
  wrap.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.target.dataset.p == null) return;
    e.preventDefault();
    const nxt = wrap.querySelector('input[data-p="' + (Number(e.target.dataset.p) + 1) + '"][data-c="' + e.target.dataset.c + '"]');
    if (nxt) { nxt.focus(); nxt.select?.(); }
  });
  wrap.addEventListener('input', (e) => {
    const el = e.target;
    if (el.dataset.col != null) {
      const i = Number(el.dataset.col);
      const name = el.value;
      if (name.trim()) { t.cols[i] = name; save(); }
      return;
    }
    if (el.dataset.p != null) {
      const p = t.plots[Number(el.dataset.p)];
      const ci = el.dataset.c;
      const raw = el.value.trim();
      const n = parseEntry(raw);
      const prev = p.vals[ci] ?? null;
      if (n == null) delete p.vals[ci]; else p.vals[ci] = n;
      logFieldEdit(t, p, Number(ci), prev, n);
      // Live out-of-range flag on the edited cell.
      const bad = outOfRange(p.vals[ci], colR[Number(ci)]);
      el.classList.toggle('warn', bad);
      if (bad) el.title = 'Outside the valid range ' + colR[Number(ci)]; else el.removeAttribute('title');
      const g = colGroups(t.cols).find(x => x.subs.includes(Number(ci)));
      if (g) {
        updateGroupMean(p, g);
        const meanEl = wrap.querySelector('input[data-p="' + el.dataset.p + '"][data-c="' + g.mean + '"]');
        if (meanEl) {
          meanEl.value = p.vals[g.mean] ?? '';
          const mbad = outOfRange(p.vals[g.mean], colR[g.mean]);
          meanEl.classList.toggle('warn', mbad);
          if (mbad) meanEl.title = 'Outside the valid range ' + colR[g.mean]; else meanEl.title = 'Mean of the subsamples';
        }
      }
      save();
    }
  });
  main.querySelector('#addCol').onclick = () => {
    t.cols.push('New variable ' + (t.cols.length + 1));
    save(); render();
    const inputs = main.querySelectorAll('thead input');
    inputs[inputs.length - 1]?.focus();
    inputs[inputs.length - 1]?.select();
  };
  wireModeToggle();
}

/* ── results ───────────────────── */
/* Per-treatment means computed right on the phone — a field-side sanity check, not the
   full ANOVA (that runs in desktop ARIS after import). */
/* A data-quality summary for the current trial: completion + how many entered values fall
   outside their variable's valid range (using the same ranges as the entry-grid flags). */
function qaSummary(t) {
  const colR = colRanges(t);
  const groups = colGroups(t.cols);
  // Count "cells" as plot values per variable group (the mean col, or the plain col).
  const perPlotCols = groups.map(g => (g.mean != null ? g.mean : (g.subs[0] ?? null))).filter(i => i != null);
  const totalCells = t.plots.length * perPlotCols.length;
  let filled = 0;
  const flags = [];
  for (const p of t.plots) {
    for (const ci of perPlotCols) {
      const v = p.vals[ci];
      if (typeof v === 'number' && isFinite(v)) {
        filled++;
        if (outOfRange(v, colR[ci])) flags.push({ plot: p.plot, variable: t.cols[ci], value: v, range: colR[ci] });
      }
    }
  }
  const plotsWithData = t.plots.filter(p => Object.keys(p.vals).length).length;
  return { totalCells, filled, plotsWithData, plotsTotal: t.plots.length, flags };
}
function qaSummaryHTML(t) {
  const q = qaSummary(t);
  const pct = q.totalCells ? Math.round((q.filled / q.totalCells) * 100) : 0;
  const flagLine = q.flags.length
    ? `<p class="qaWarn">⚠ ${q.flags.length} value${q.flags.length === 1 ? '' : 's'} outside the valid range:</p>
       <ul class="histList">${q.flags.slice(0, 30).map(f => `<li>Plot ${f.plot} · ${esc(f.variable)}: <b>${esc(String(f.value))}</b> <span class="muted">(range ${esc(f.range)})</span></li>`).join('')}</ul>`
    : `<p class="muted">No values are outside their valid range.</p>`;
  return `<div class="card"><h2>Data quality</h2>
    <p class="muted">${q.plotsWithData} of ${q.plotsTotal} plots have data · ${q.filled} of ${q.totalCells} plot values entered (${pct}%).</p>
    ${flagLine}
  </div>`;
}

function renderResults(t) {
  const cards = t.cols.map((c, ci) => {
    const byTrt = new Map();
    for (const p of t.plots) {
      const v = p.vals[ci];
      if (typeof v !== 'number') continue;
      if (!byTrt.has(p.trt)) byTrt.set(p.trt, []);
      byTrt.get(p.trt).push(v);
    }
    if (!byTrt.size) {
      return `<div class="card"><h2>${esc(c)}</h2><p class="muted">No values entered yet.</p></div>`;
    }
    const rows = [...byTrt.entries()].map(([trt, vs]) => ({
      trt, n: vs.length, mean: vs.reduce((a, b) => a + b, 0) / vs.length,
      min: Math.min(...vs), max: Math.max(...vs),
    }));
    rows.sort((a, b) => b.mean - a.mean);
    const hi = rows[0].mean, lo = rows[rows.length - 1].mean;
    const body = rows.map(r =>
      `<tr><td>${esc(r.trt)}</td><td>${r.n}</td><td>${r.mean.toFixed(2)}</td><td>${r.min}–${r.max}</td></tr>`
    ).join('');
    return `<div class="card"><h2>${esc(c)}</h2>
      <div style="overflow-x:auto"><table class="res">
        <thead><tr><th>Trt</th><th>n</th><th>Mean</th><th>Range</th></tr></thead>
        <tbody>${body}</tbody>
      </table></div>
      <p class="muted" style="margin-top:6px">Highest mean ${hi.toFixed(2)}, lowest ${lo.toFixed(2)} · sorted high→low.</p>
    </div>`;
  }).join('');
  const sessNote = (t.sessions || []).length
    ? `<p class="muted center">Showing the CURRENT rating day. ${t.sessions.length} earlier day${t.sessions.length === 1 ? '' : 's'} (${t.sessions.map(x => x.date).join(', ')}) are archived and will be in the bundle \u2014 desktop ARIS turns them into progress curves.</p>`
    : '';
  main.innerHTML = qaSummaryHTML(t) + cards + sessNote +
    '<p class="muted center">Simple field means — no significance testing here. Import into desktop ARIS for the full ANOVA, letters and CV.</p>' +
    '<p class="muted center" style="font-size:11.5px">' + esc(watermarkLine()) + '</p>';
}

/* ── notes + voice memos ────────────────────────────── */
let recorder = null;
let recChunks = [];
function stopRecorder(keep) {
  if (recorder && recorder.state !== 'inactive') {
    if (!keep) recorder.onstop = null;
    recorder.stop();
    recorder.stream?.getTracks().forEach(tr => tr.stop());
  }
  if (!keep) recorder = null;
}
function renderNotes(t) {
  const canRecord = !!(navigator.mediaDevices?.getUserMedia && window.MediaRecorder);
  main.innerHTML = `
    <div class="card">
      <h2>New note</h2>
      <label class="f">Note<textarea id="txt" rows="3" placeholder="e.g. Heavy fog until 10am, rows 3 and 4 still wet"></textarea></label>

    </div>
    <div class="card">
      <h2>Voice memos <span class="muted" id="vmCount"></span></h2>
      ${canRecord
        ? `<label class="f">Caption for the next recording (optional)<input type="text" id="vmCap" placeholder="e.g. Plot 12 disease check" /></label>
           <button class="btn secondary" id="rec">🎙️ Start recording</button>
           <p class="muted" style="margin-top:6px">The first time, your phone will ask to allow the microphone — tap <b>Allow</b>. If you tapped Don’t Allow before, turn it back on in Settings → ARIS Field → Microphone.</p>`
        : '<p class="muted">Voice recording isn’t available in this browser. On an iPhone it works after adding the app to the Home Screen (needs iOS 15 or newer).</p>'}
      <div id="vmList"></div>
    </div>
    <div class="card"><h2>Notes (${t.notes.length})</h2><div id="list">${t.notes.length ? '' : '<p class="muted">No notes yet.</p>'}</div></div>`;
  const list = main.querySelector('#list');
  [...t.notes].reverse().forEach((e, ri) => {
    const idx = t.notes.length - 1 - ri;
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `<button class="del" data-i="${idx}">✕</button><div class="ts">${fmtTs(e.ts)}</div><div>${esc(e.text)}</div>`;
    list.appendChild(div);
  });
  list.onclick = (e) => { const i = e.target.dataset.i; if (i != null) { t.notes.splice(Number(i), 1); save(); render(); } };
  main.querySelector('#add').onclick = () => {
    const text = main.querySelector('#txt').value.trim();
    if (!text) return;
    t.notes.push({ ts: new Date().toISOString(), text });
    save(); render();
  };
  const recBtn = main.querySelector('#rec');
  if (recBtn) recBtn.onclick = async () => {
    if (recorder && recorder.state === 'recording') { stopRecorder(true); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mime = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4'
        : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
      recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
      recChunks = [];
      recorder.ondataavailable = (e) => { if (e.data.size) recChunks.push(e.data); };
      recorder.onstop = async () => {
        clearInterval(window.__recTimer);
        try { window.__wakeLock?.release(); } catch (e) {}
        window.__wakeLock = null;
        const blob = new Blob(recChunks, { type: recorder.mimeType || 'audio/mp4' });
        stream.getTracks().forEach(tr => tr.stop());
        recorder = null;
        if (!blob.size) {
          flash = { text: 'Nothing was recorded — the microphone produced no audio. Check the mic permission and try again.', err: true };
          render();
          return;
        }
        await mediaPut({
          id: uid('vm'), trialId: t.id, kind: 'voice', ts: new Date().toISOString(),
          caption: main.querySelector('#vmCap')?.value.trim() ?? '',
          mime: blob.type || 'audio/mp4', blob,
        });
        flash = { text: 'Voice memo saved on this phone.' };
        render();
      };
      recorder.start(1000); // timeslice: chunks land every second, so a memo survives even if stop misbehaves
      try { window.__wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {}
      const t0 = Date.now();
      window.__recTimer = setInterval(() => {
        const secs = Math.floor((Date.now() - t0) / 1000);
        const mm = Math.floor(secs / 60);
        const ss = String(secs % 60).padStart(2, '0');
        recBtn.innerHTML = '<span class="recDot"></span>Recording ' + mm + ':' + ss + ' — tap to stop';
      }, 500);
      recBtn.innerHTML = '<span class="recDot"></span>Recording… tap to stop';
      recBtn.classList.remove('secondary');
    } catch (err) {
      const denied = err.name === 'NotAllowedError' || err.name === 'SecurityError';
      flash = {
        err: true,
        text: denied
          ? 'Microphone permission is blocked. On iPhone: Settings → ARIS Field (or Safari) → Microphone → Allow, then try again.'
          : err.name === 'NotFoundError'
            ? 'No microphone was found on this device.'
            : 'Could not start recording: ' + (err.message || err.name),
      };
      render();
    }
  };
  paintVoice(t);
}

  const memos = await mediaList(t.id, 'voice');

  };
}

/* iOS standalone keeps the window SHRUNK by the keyboard-accessory height (~55pt) after the
   keyboard closes — every fixed/flex bottom then floats that far above the real screen edge
   (confirmed on-device: the gap equals the accessory bar exactly). The only known cure is to
   make WebKit recompute the viewport: give the page something to scroll for one frame, scroll
   it, snap back. Run whenever the reported window is suspiciously short. */
/* Viewport heal, SELF-CALIBRATED: learn this device's healthy shortfall at launch and only run
   when the deficit GROWS past it (the stale-after-keyboard state). Event-driven only — never
   on an interval — with a cooldown, so it can't loop or flicker. */
var baselineDeficit = null;
var lastHealAt = 0;
setTimeout(() => { baselineDeficit = screen.height - window.innerHeight; }, 400);
function healViewport() {
  if (window.innerWidth > window.innerHeight) return;
  if (baselineDeficit == null) return;
  const deficit = screen.height - window.innerHeight;
  if (deficit <= baselineDeficit + 30 || deficit > baselineDeficit + 300) return;
  const kb = window.visualViewport && window.innerHeight - window.visualViewport.height > 120;
  if (kb) return;
  const now = Date.now();
  if (now - lastHealAt < 3000) return;
  lastHealAt = now;
  const html = document.documentElement;
  html.style.height = (window.innerHeight + (deficit - baselineDeficit) + 2) + 'px';
  window.scrollTo(0, 2);
  setTimeout(() => {
    window.scrollTo(0, 0);
    html.style.height = '';
  }, 60);
}
var healTimer = null; // var: render() runs before this line, let would TDZ-throw
function scheduleHeal() {
  clearTimeout(healTimer);
  healTimer = setTimeout(healViewport, 300);
}
document.addEventListener('focusout', scheduleHeal);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') scheduleHeal(); });
window.addEventListener('orientationchange', () => setTimeout(() => {
  baselineDeficit = screen.height - window.innerHeight;
}, 600));

/* Keyboard-aware chrome: hide the fixed bottom bar (and floating banners) while the on-screen
   keyboard is open, and nudge scroll on close so iOS re-pins position:fixed correctly. */
(function keyboardWatcher() {
  const chrome = () => [
    document.getElementById('tabs'),
    document.querySelector('footer.status'),
    document.querySelector('.banner.update'),
  ].filter(Boolean);
  let kbOpen = false;
  const setKb = (open) => {
    if (open === kbOpen) return;
    kbOpen = open;
    chrome().forEach((el) => el.classList.toggle('kbHidden', open));
    // Static layout: nothing to re-pin after the keyboard — hiding the chrome while typing
    // simply gives <main> the extra room.
  };
  // Two independent signals, OR-ed: iOS resizes the visual viewport for the text keyboard,
  // but the SELECT/date picker wheel raises WITHOUT a resize — focus tracking catches those.
  let vvOpen = false;
  let focusOpen = false;
  const apply = () => setKb(vvOpen || focusOpen);
  const vv = window.visualViewport;
  if (vv) {
    const onVV = () => { vvOpen = window.innerHeight - vv.height > 120; apply(); };
    vv.addEventListener('resize', onVV);
    vv.addEventListener('scroll', onVV);
  }
  document.addEventListener('focusin', (e) => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && e.target.type !== 'checkbox' && e.target.type !== 'button' && e.target.type !== 'file') {
      focusOpen = true;
      apply();
    }
  });
  document.addEventListener('focusout', () => setTimeout(() => {
    const t = document.activeElement?.tagName ?? '';
    if (!/^(INPUT|TEXTAREA|SELECT)$/.test(t)) {
      focusOpen = false;
      apply();
    }
  }, 100));
})();

/* Status footer: version, online state, storage protection. */
const foot = document.createElement('footer');
foot.className = 'status';
document.body.appendChild(foot);
async function paintFooter() {
  const persisted = await (navigator.storage?.persisted?.() ?? Promise.resolve(false));
  foot.innerHTML = '<span class="dot ' + (navigator.onLine ? 'on' : 'off') + '"></span>' +
    (navigator.onLine ? 'Online' : 'Offline — everything still works') +
    ' · v' + APP_VERSION +
    ' · storage ' + (persisted ? 'protected' : 'best-effort') +
    (function () { const st = licState(licLoad()); if (st.status === 'trial') return ' · Trial: ' + st.daysLeft + 'd left'; const a = acctState(acctLoad()); return a.status === 'trial' ? ' · Trial: ' + a.daysLeft + 'd left' : ''; })() +
    '<span class="legal">\u00a9 2026 Cody Shofner \u00b7 ARIS Field\u2122 \u00b7 <a href="#" id="footLegal">Legal</a></span>';
}
foot.addEventListener('click', (e) => { if (e.target && e.target.id === 'footLegal') { e.preventDefault(); openEulaPanel(); } });
window.addEventListener('online', paintFooter);
window.addEventListener('offline', paintFooter);
paintFooter();

/* Ask the OS to protect our storage from cleanup (critical on iPhones). Re-request on
   meaningful moments; browsers grant it silently for installed/home-screen apps. */
async function requestPersistence() {
  try { await navigator.storage?.persist?.(); } catch (e) {}
  paintFooter();
}
requestPersistence();

/* Licensing boot: block the app until an activated license or running trial is cached,
   then refresh it against the registry (upgrades apply, revoked emails drop). */
showGateIfNeeded();
acctRevalidate();
// Re-check the account whenever the app comes back to the foreground or regains a connection,
// and every 30 minutes while open — so a suspension or expiry locks the phone promptly, not
// only at the next cold start.
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') acctRevalidate(); });
window.addEventListener('online', () => acctRevalidate());
setInterval(() => { if (document.visibilityState === 'visible') acctRevalidate(); }, 30 * 60 * 1000);
licRevalidate();

/* Install hint when running in a plain browser tab (not from the Home Screen). */
(function installHint() {
  const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (standalone || localStorage.getItem('arisField.hintDismissed')) return;
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const b = document.createElement('div');
  b.className = 'banner';
  b.innerHTML = '<div class="grow">' + (isIOS
    ? 'Install this app: tap the Share button, then <b>Add to Home Screen</b>. It then works fully offline.'
    : 'Tip: install this app from your browser menu (Add to Home screen / Install) for offline use.') +
    '</div><button id="hintX">Got it</button>';
  document.body.insertBefore(b, document.body.firstChild);
  b.querySelector('#hintX').onclick = () => { localStorage.setItem('arisField.hintDismissed', '1'); b.remove(); };
})();

/* Service worker with a visible update flow: when a new version is deployed, a banner
   offers the update instead of silently serving the old cached app. */
applySunlight();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then((reg) => {
    const offer = (worker) => {
      if (!navigator.serviceWorker.controller) return; // first install, nothing to update
      const b = document.createElement('div');
      b.className = 'banner update';
      b.innerHTML = '<div class="grow">A new version of ARIS Field is ready.</div><button id="updNow">Update now</button>';
      document.body.appendChild(b);
      b.querySelector('#updNow').onclick = () => worker.postMessage('SKIP_WAITING');
    };
    if (reg.waiting) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      nw?.addEventListener('statechange', () => {
        if (nw.state === 'installed' && navigator.serviceWorker.controller) offer(nw);
      });
    });
  });
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!refreshing) { refreshing = true; location.reload(); }
  });
}
</script>
